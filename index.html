<title>Spadano Planner</title>

<style>
:root{ --navy:#0C2340; --navy2:#1A1A2E; --card:#142a4d; --card2:#11233f; --or:#F26522; --or2:#E8701A;

*{box-sizing:border-box} html,body{margin:0;padding:0}
body{ background:var(--navy2); color:var(--tx); font-family:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.45; }
#app{max-width:680px;margin:0 auto;min-height:100vh}
header{ position:sticky; top:0; z-index:10; background:linear-gradient(180deg,var(--navy) 0%, #0b1f38 100%); border-bottom:1px solid var(--line); padding:14px 16px 0; }
.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{ width:42px;height:42px;border-radius:9px;background:var(--navy2);border:2px solid var(--or); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:800; letter-spacing:1px; font-family:"Bebas Neue",Impact,sans-serif; font-size:20px; }
.bt{ font-family:"Bebas Neue",Impact,sans-serif; letter-spacing:1.5px; font-size:20px; line-height:1 }
.bs{ color:var(--mut); font-size:11.5px; margin-top:3px }
.tabs{display:flex;gap:4px}
.tb{ flex:1; background:transparent; color:var(--mut); border:0; border-bottom:3px solid transparent; padding:11px 6px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
.tb.on{ color:#fff; border-bottom-color:var(--or) }
main{ padding:16px 14px 60px }
.wkchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{ background:var(--card2); color:var(--mut); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
.chip.on{ background:var(--or); color:#fff; border-color:var(--or) }
.wkhead{margin-bottom:12px}
.wkt{ font-family:"Bebas Neue",Impact,sans-serif; letter-spacing:1px; font-size:23px; color:#fff }
.wkg{ color:var(--mut); font-size:12.5px; font-style:italic; margin-top:3px }
.card{ background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px; margin-bottom:13px; }
.dhead{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.badge{ font-size:10px; font-weight:800; letter-spacing:.6px; padding:3px 8px; border-radius:6px; color:#fff }
.badge.reel{background:#2b66c9} .badge.caro{background:#7a4cc0} .badge.stor{background:#2c8a6b}
.dlab{ color:var(--mut); font-size:12px; font-weight:700 }
.dtitle{ font-size:16px; font-weight:700; color:#fff; line-height:1.3 }
.meta{ color:var(--mut); font-size:12px; margin-top:5px }
.meta.q{ color:#cdb38f }
.nota{ color:#cdb38f; font-size:12px; font-style:italic; margin-top:6px; border-left:2px solid var(--or); padding-left:9px }
.blk{ margin-top:11px; background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:10px 11px }
.blab{ display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--or); margin-bottom:7px }
.hint{ text-transform:none; letter-spacing:0; font-weight:600; color:var(--mut); font-size:10.5px }
pre{ white-space:pre-wrap; word-wrap:break-word; margin:0; font-family:inherit; font-size:13.5px; color:var(--tx) }
.txt{ font-size:13.5px; color:var(--tx) }
.hash{ margin-top:8px; color:#8fd0ff; font-size:12px; word-wrap:break-word }
.stories{ margin:0; padding-left:18px; font-size:13.5px } .stories li{ margin-bottom:5px }
.checks{ display:flex; flex-direction:column; gap:7px }
.chk{ display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer; color:var(--mut); user-select:none }
.chk .box{ width:19px;height:19px;flex:0 0 19px; border:2px solid var(--line); border-radius:5px; display:flex;align-items:center;justify-content:center; font-size:13px; color:#fff }
.chk.on{ color:var(--tx) } .chk.on .box{ background:var(--or); border-color:var(--or) }
.cp{ background:var(--or); color:#fff; border:0; border-radius:8px; padding:9px 13px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; margin:5px 7px 0 0 }
.cp.mini{ padding:5px 10px; font-size:11.5px; margin:0 0 0 auto }
.cp.done{ background:#2c8a6b }
.cp.danger{ background:transparent; color:#ff8f8f; border:1px solid #6b2a2a }
.intro{ color:var(--mut); font-size:13px; margin-bottom:14px }
.dmhead{ display:flex; align-items:center; gap:10px; margin-bottom:6px }
.kw{ color:#fff; font-weight:800; letter-spacing:.5px; padding:5px 11px; border-radius:7px; font-size:13px }
.dmfase{ color:var(--mut); font-size:12px }
.cfase{ font-size:13px; padding:8px 0; border-bottom:1px solid var(--line) } .cfase:last-child{border-bottom:0}
.trig{ margin-top:8px; color:#8fd0ff; font-size:12.5px }
.ul{ margin:0; padding-left:18px; font-size:13px } .ul li{ margin-bottom:6px }
.tools .cp{ display:inline-block }
.toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#000; color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:50 }
.toast.show{ opacity:.94; transform:translateX(-50%) translateY(0) }
</style>
</head>

<script>/* Spadano Planner — logica (vanilla, delega di eventi) */
(function(){
  "use strict";
  var SEED = (typeof PLAN!=='undefined') ? PLAN : (globalThis.PLAN||{});
  var LS_PLAN='spadano_v8_plan', LS_CHK='spadano_v8_checks';
  var plan, checks, COPY=[];

  function load(){
    try{ var p=localStorage.getItem(LS_PLAN); plan=p?JSON.parse(p):SEED; }catch(e){ plan=SEED; }
    if(!plan || !plan.weeks){ plan=SEED; }
    try{ checks=JSON.parse(localStorage.getItem(LS_CHK)||'{}')||{}; }catch(e){ checks={}; }
  }
  function saveChecks(){ try{ localStorage.setItem(LS_CHK, JSON.stringify(checks)); }catch(e){} }
  function savePlan(){ try{ localStorage.setItem(LS_PLAN, JSON.stringify(plan)); }catch(e){} }

  var state={ tab:'piano', week:null };
  function firstWeek(){ return (plan.weeks&&plan.weeks[0])?plan.weeks[0].n:3; }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function cidx(t){ COPY.push(t==null?'':String(t)); return COPY.length-1; }
  function cpBtn(text,label){ return '<button class="cp mini" data-action="copy" data-i="'+cidx(text)+'">'+esc(label||'Copia')+'</button>'; }
  function typeClass(t){ t=(t||'').toUpperCase(); return t.indexOf('CAROSELLO')>=0?'caro':(t.indexOf('STORIES')>=0?'stor':'reel'); }
  function weekShort(w){ return w.n==='ponte'?'Ponte':('S'+w.n); }
  function parseWeek(v){ return v==='ponte'?'ponte':parseInt(v,10); }

  function block(label,text,pre){
    return '<div class="blk"><div class="blab">'+esc(label)+cpBtn(text,'Copia')+'</div>'+
           (pre?'<pre>':'<div class="txt">')+esc(text)+(pre?'</pre>':'</div>')+'</div>';
  }

  function dayCard(d,wk){
    var h='<div class="card">';
    h+='<div class="dhead"><span class="badge '+typeClass(d.type)+'">'+esc(d.type||'')+'</span>'+
       '<span class="dlab">'+esc(d.lab)+(d.time?' · '+esc(d.time):'')+'</span></div>';
    h+='<div class="dtitle">'+esc(d.title)+'</div>';
    var sub=[]; if(d.pillar)sub.push('pilastro: '+d.pillar); if(d.cta)sub.push('CTA: '+d.cta);
    if(sub.length) h+='<div class="meta">'+esc(sub.join(' · '))+'</div>';
    if(d.domanda) h+='<div class="meta q">domanda: '+esc(d.domanda)+'</div>';
    if(d.nota) h+='<div class="nota">'+esc(d.nota)+'</div>';
    if(d.cover) h+=block('Cover (System A)', d.cover, false);
    if(d.script) h+=block(typeClass(d.type)==='caro'?'Slide carosello':'Script', d.script, true);
    if(d.caption){
      var capH=d.caption+(wk.hashtag?('\n\n'+wk.hashtag):'');
      h+='<div class="blk"><div class="blab">Caption <span class="hint">+ hashtag</span>'+cpBtn(capH,'Copia caption')+'</div><pre>'+esc(d.caption)+'</pre>';
      if(wk.hashtag) h+='<div class="hash">'+esc(wk.hashtag)+'</div>';
      h+='</div>';
    }
    if(d.primo_commento) h+=block('Primo commento (fissalo)', d.primo_commento, false);
    if(d.stories&&d.stories.length){
      h+='<div class="blk"><div class="blab">Stories</div><ol class="stories">';
      for(var i=0;i<d.stories.length;i++) h+='<li>'+esc(d.stories[i])+'</li>';
      h+='</ol></div>';
    }
    if(d.tasks&&d.tasks.length){
      h+='<div class="blk"><div class="blab">Checklist</div><div class="checks">';
      for(var j=0;j<d.tasks.length;j++){ var key=d.id+':'+j, on=!!checks[key];
        h+='<span class="chk'+(on?' on':'')+'" data-action="chk" data-key="'+esc(key)+'"><span class="box">'+(on?'✓':'')+'</span>'+esc(d.tasks[j])+'</span>'; }
      h+='</div></div>';
    }
    h+='</div>'; return h;
  }

  function renderPiano(){
    var wk=null,i; for(i=0;i<plan.weeks.length;i++){ if(plan.weeks[i].n===state.week){ wk=plan.weeks[i]; break; } }
    if(!wk) wk=plan.weeks[0];
    var h='<div class="wkchips">';
    for(i=0;i<plan.weeks.length;i++){ var w=plan.weeks[i];
      h+='<button class="chip'+(w.n===wk.n?' on':'')+'" data-action="week" data-w="'+esc(w.n)+'">'+esc(weekShort(w))+'</button>'; }
    h+='</div>';
    h+='<div class="wkhead"><div class="wkt">'+esc(wk.title)+'</div>'+(wk.goal?'<div class="wkg">'+esc(wk.goal)+'</div>':'')+'</div>';
    for(i=0;i<wk.days.length;i++) h+=dayCard(wk.days[i],wk);
    if(wk.hashtag) h+='<div class="blk hashblk"><div class="blab">Hashtag della settimana'+cpBtn(wk.hashtag,'Copia hashtag')+'</div><div class="hash">'+esc(wk.hashtag)+'</div></div>';
    return h;
  }

  function renderDM(){
    var h='<div class="intro">I quattro inneschi DM e la struttura della call. Copia ogni passo.</div>',i,j;
    for(i=0;i<plan.dm.length;i++){ var k=plan.dm[i];
      h+='<div class="card"><div class="dmhead"><span class="kw" style="background:'+esc(k.colore||'#0C2340')+'">'+esc(k.keyword)+'</span><span class="dmfase">'+esc(k.fase)+'</span></div>';
      for(j=0;j<k.steps.length;j++) h+='<div class="blk"><div class="blab">Passo '+(j+1)+cpBtn(k.steps[j],'Copia')+'</div><div class="txt">'+esc(k.steps[j])+'</div></div>';
      h+='</div>';
    }
    if(plan.call){ h+='<div class="card"><div class="dtitle">Call · '+esc(plan.call.durata)+'</div>';
      for(i=0;i<plan.call.fasi.length;i++) h+='<div class="cfase">'+esc(plan.call.fasi[i])+'</div>'; h+='</div>'; }
    return h;
  }

  function listCard(t,arr){ if(!arr||!arr.length) return ''; var s='<div class="card"><div class="blab">'+esc(t)+'</div><ul class="ul">',i;
    for(i=0;i<arr.length;i++) s+='<li>'+esc(arr[i])+'</li>'; return s+'</ul></div>'; }

  function renderGuida(){
    var m=plan.meta||{}, h='';
    h+='<div class="card"><div class="dtitle">'+esc(m.title||'Piano')+'</div><div class="meta">'+esc(m.subtitle||'')+'</div>'+(m.triggers?'<div class="trig">'+esc(m.triggers)+'</div>':'')+'</div>';
    h+=listCard('Regole fisse', m.regole);
    h+=listCard('Cosa misurare', m.cosa_misurare);
    h+=listCard('Da completare', m.da_completare);
    if(m.prezzi){ h+='<div class="card"><div class="blab">Prezzi (tier Lancio)</div><ul class="ul">'; var ks=Object.keys(m.prezzi);
      for(var i=0;i<ks.length;i++) h+='<li><b>'+esc(ks[i])+'</b> — '+esc(m.prezzi[ks[i]])+'</li>'; h+='</ul></div>'; }
    h+='<div class="card tools"><div class="blab">Dati e backup</div>'+
       '<button class="cp" data-action="export">Esporta JSON</button>'+
       '<button class="cp" data-action="import">Importa JSON</button>'+
       '<button class="cp danger" data-action="reset">Ripristina piano originale</button>'+
       '<div class="hint">Esporta = backup (piano + spunte). Importa = sostituisce il piano. Ripristina = ricarica il piano di fabbrica e azzera le spunte.</div></div>';
    return h;
  }

  function renderBody(){ COPY=[]; return state.tab==='piano'?renderPiano():(state.tab==='dm'?renderDM():renderGuida()); }

  function tab(id,label){ return '<button class="tb'+(state.tab===id?' on':'')+'" data-action="tab" data-tab="'+id+'">'+esc(label)+'</button>'; }

  function render(){
    var root=document.getElementById('app'); if(!root) return;
    var sub=(plan.meta&&plan.meta.subtitle)||'';
    root.innerHTML =
      '<header><div class="brand"><span class="logo">SC</span><div><div class="bt">SPADANO PLANNER</div><div class="bs">'+esc(sub)+'</div></div></div>'+
      '<nav class="tabs">'+tab('piano','Piano')+tab('dm','DM')+tab('guida','Guida')+'</nav></header>'+
      '<main id="bodyMain">'+renderBody()+'</main>'+
      '<div id="toast" class="toast"></div>';
  }

  function toast(msg){ var t=document.getElementById('toast'); if(!t)return; t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1100); }

  function doCopy(text,el){
    function ok(){ var old=el.textContent; el.textContent='Copiato ✓'; el.classList.add('done'); setTimeout(function(){el.textContent=old; el.classList.remove('done');},900); toast('Copiato negli appunti'); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok).catch(function(){fallback(text);ok();}); }
    else { fallback(text); ok(); }
  }
  function fallback(text){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }

  function doExport(){
    var data={ exported_at:new Date().toISOString(), plan:plan, checks:checks };
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='spadano-planner-backup.json'; document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a); URL.revokeObjectURL(url);},100); toast('Backup esportato');
  }
  function handleImport(file){
    var r=new FileReader();
    r.onload=function(){ try{ var o=JSON.parse(r.result); var np=o.plan?o.plan:o;
        if(np&&np.weeks){ plan=np; savePlan(); if(o.checks){checks=o.checks; saveChecks();} state.week=firstWeek(); render(); toast('Piano importato'); }
        else toast('File non valido'); }catch(e){ toast('File non valido'); } };
    r.readAsText(file);
  }

  function attach(){
    document.addEventListener('click', function(e){
      var el=e.target.closest('[data-action]'); if(!el) return;
      var a=el.getAttribute('data-action');
      if(a==='tab'){ state.tab=el.getAttribute('data-tab'); render(); window.scrollTo(0,0); }
      else if(a==='week'){ state.week=parseWeek(el.getAttribute('data-w')); render(); window.scrollTo(0,0); }
      else if(a==='copy'){ doCopy(COPY[+el.getAttribute('data-i')]||'', el); }
      else if(a==='chk'){ var key=el.getAttribute('data-key'); checks[key]=!checks[key]; saveChecks(); el.classList.toggle('on'); var b=el.querySelector('.box'); if(b)b.textContent=checks[key]?'✓':''; }
      else if(a==='export'){ doExport(); }
      else if(a==='import'){ var fi=document.getElementById('fileIn'); if(fi)fi.click(); }
      else if(a==='reset'){ if(confirm('Ripristinare il piano originale e azzerare le spunte?')){ try{localStorage.removeItem(LS_PLAN);localStorage.removeItem(LS_CHK);}catch(e){} load(); state.week=firstWeek(); render(); toast('Piano ripristinato'); } }
    });
    var fi=document.getElementById('fileIn');
    if(fi) fi.addEventListener('change', function(e){ if(e.target.files&&e.target.files[0]) handleImport(e.target.files[0]); e.target.value=''; });
  }

  // boot (solo in browser)
  if(typeof document!=='undefined' && document.getElementById){
    load(); state.week=firstWeek();
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){render(); attach();});
    else { render(); attach(); }
    if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }); }
  }

  // esposizione per test offline (innocua nel browser)
  globalThis.SP = { load:load, renderPiano:renderPiano, renderDM:renderDM, renderGuida:renderGuida, renderBody:renderBody,
                    getCopy:function(){return COPY;}, setState:function(t,w){ state.tab=t; if(w!==undefined)state.week=w; }, getPlan:function(){return plan;} };
})();
</script>
