<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#142038">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spadano">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Spadano Planner</title>
<style>
  :root{
    --navy:#142038; --navy2:#0E1830; --navybox:#1B2C4A;
    --orange:#E8701A; --orange2:#F26522;
    --cream:#FAF6EF; --panel:#F3EEE3; --bg:#EFEAE0;
    --ink:#23232E; --grey:#6A6456; --line:#E2DCCB; --green:#27795B;
    --white:#fff;
    --maxw:520px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 12px;
        padding-top:calc(12px + var(--safe-top));
        padding-bottom:calc(96px + var(--safe-bot));}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:inherit;font-size:16px}/* 16px = no zoom iOS */

  /* ---------- HEADER ---------- */
  .hdr{background:var(--navy);border-radius:18px;padding:16px 18px;margin:6px 0 12px;
       position:relative;overflow:hidden}
  .hdr::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(#23314F 1px,transparent 1px),linear-gradient(90deg,#23314F 1px,transparent 1px);
    background-size:34px 34px;opacity:.5}
  .hdr-row{position:relative;display:flex;align-items:center;justify-content:space-between}
  .hdr h1{font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff;margin:0;text-transform:uppercase}
  .hdr h1 span{color:var(--orange)}
  .hdr .rule{height:3px;width:52px;background:var(--orange);border-radius:2px;margin:8px 0 6px;position:relative}
  .hdr .sub{position:relative;font-size:12px;color:#B9C3D8}
  .gear{position:relative;width:38px;height:38px;border-radius:11px;background:#23314F;
        display:flex;align-items:center;justify-content:center;color:#B9C3D8;font-size:18px}

  /* ---------- TABS ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:12px;font-size:12.5px;font-weight:800;
       letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line);background:#FFFDF8;color:var(--navy)}
  .tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}

  /* ---------- CARDS ---------- */
  .card{border-radius:14px;background:#FFFDF8;border:1px solid var(--line);padding:13px;margin-bottom:12px}
  .banner{border-radius:13px;padding:11px 13px;margin-bottom:12px;background:var(--navy2)}
  .banner .k{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--orange);margin-bottom:4px}
  .banner .t{font-size:12px;color:#fff;line-height:1.5}
  .banner b{color:#fff}
  .alert{border-radius:13px;padding:11px 13px;margin-bottom:12px;display:flex;gap:8px;align-items:center;
         background:#FBEFE2;border:1px solid var(--orange);color:var(--navy);font-size:12.5px;font-weight:700}

  .sec-line{height:3px;width:46px;background:var(--orange);border-radius:2px;margin-bottom:8px}
  .sec-title{font-size:16px;font-weight:800;letter-spacing:-.4px;text-transform:uppercase;color:var(--navy)}
  .sec-sub{font-size:12px;line-height:1.35;color:#6E6755;margin-top:1px}

  /* ---------- DAY CARD ---------- */
  .day{border-radius:13px;overflow:hidden;background:#FFFDF8;border:1px solid var(--line);
       border-left:5px solid var(--navy);margin-bottom:12px}
  .day.today{border:2px solid var(--orange);border-left:5px solid var(--orange)}
  .day-head{padding:10px 13px}
  .day-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .day-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .day-lab{font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--navy)}
  .badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:#fff}
  .badge.lt{background:#EFE8D8;color:var(--navy)}
  .day-prog{font-size:11px;font-weight:800;color:var(--grey)}
  .day-prog.done{color:var(--green)}
  .day-title{font-size:13px;font-weight:700;margin-top:3px;line-height:1.3;color:var(--ink)}
  .chips{margin-top:6px}
  .chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;
        letter-spacing:.3px;text-transform:uppercase;margin:0 5px 4px 0;background:#EFE8D8;color:var(--navy)}
  .chip.dark{background:var(--navy);color:#fff}
  .day-body{padding:0 13px 13px}
  .nota{font-size:12px;margin-bottom:8px;padding:8px 10px;border-radius:9px;background:#EFE8D8;color:var(--navy);line-height:1.35}

  /* ---------- COPY BLOCK ---------- */
  .copy{margin-bottom:8px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .copy-h{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#EFE8D8}
  .copy-h span{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--navy)}
  .copy-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:800;background:var(--orange);color:#fff}
  .copy-btn.ok{background:var(--green)}
  .copy pre{margin:0;padding:9px 11px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--cream);color:var(--ink);font-family:inherit}

  .lbl{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
  .story-li{font-size:12.5px;line-height:1.35;padding:2px 0;display:flex;gap:6px;color:var(--ink)}
  .story-li .n{color:var(--orange);font-weight:800}

  /* ---------- CHECK ROW ---------- */
  .chk{display:flex;align-items:flex-start;gap:8px;padding:6px 0}
  .box{margin-top:2px;width:19px;height:19px;flex:0 0 auto;border-radius:6px;border:2px solid #C9BFA9;display:flex;align-items:center;justify-content:center}
  .box.on{background:var(--orange);border-color:var(--orange)}
  .box.on::after{content:"✓";color:#fff;font-size:13px;font-weight:900;line-height:1}
  .chk .x{font-size:13px;line-height:1.35;color:var(--ink)}
  .chk.done .x{color:var(--grey);text-decoration:line-through}
  .chk.dark .x{color:#fff}
  .chk.dark.done .x{color:#7E89A3}
  .chk.dark .box{border-color:#5A6680}

  /* ---------- FIRST HOUR / GROWTH ---------- */
  .navycard{border-radius:13px;padding:12px 13px;margin-bottom:12px;background:var(--navy)}
  .navycard .nh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .navycard .nh .t{font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#fff}
  .navycard .nh .p{font-size:11px;font-weight:800;margin-left:auto;color:#B9C3D8}
  .navycard .nh .p.done{color:#7BD3A8}
  .navycard .desc{font-size:11px;margin-bottom:6px;color:#B9C3D8}

  /* ---------- DATI ---------- */
  .row2{display:flex;gap:8px;margin-bottom:8px}
  .inp{width:100%;padding:8px 10px;border-radius:8px;font-size:16px;border:1px solid #C9BFA9;background:var(--cream);color:var(--ink)}
  table.metrics{width:100%;border-collapse:collapse}
  table.metrics th{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--navy);padding:4px 2px}
  table.metrics th.l{text-align:left;padding-left:0}
  table.metrics td{padding:2px}
  table.metrics td.l{font-size:11.5px;color:var(--ink);padding-right:4px}
  .mini{width:100%;padding:6px 2px;border-radius:6px;font-size:15px;text-align:center;border:1px solid #DDD3BE;background:var(--cream);color:var(--ink)}
  .dot{width:12px;height:12px;border-radius:99px;display:inline-block}
  .insights{margin-top:8px;padding:8px 10px;border-radius:9px;background:#EFE8D8}
  .insights div{font-size:11.5px;line-height:1.35;color:var(--navy)}
  .reset{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:11px;font-size:12.5px;font-weight:700;background:#EFE8D8;color:#8A8A8A;border:1px solid var(--line)}
  .reset.arm{background:#C0392B;color:#fff}

  /* ---------- FOOTER NAV (bottom bar) ---------- */
  .footnote{font-size:11px;color:var(--grey);text-align:center;margin:6px 0 0}

  /* ---------- EDITOR / FAB ---------- */
  .fab{position:fixed;right:calc(50% - var(--maxw)/2 + 16px);bottom:calc(20px + var(--safe-bot));
       width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;font-size:26px;
       display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(232,112,26,.45);z-index:40}
  @media(max-width:540px){.fab{right:16px}}
  .sheet-bg{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:50;display:none}
  .sheet-bg.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;
         background:var(--cream);border-radius:18px 18px 0 0;z-index:60;max-height:92vh;overflow-y:auto;
         transform:translateY(100%);transition:transform .25s ease;
         padding:16px 16px calc(24px + var(--safe-bot))}
  .sheet.show{transform:translateY(0)}
  .sheet-grip{width:40px;height:4px;border-radius:2px;background:#CDC5B4;margin:0 auto 14px}
  .sheet h2{font-size:18px;font-weight:800;color:var(--navy);margin:0 0 4px;text-transform:uppercase;letter-spacing:-.3px}
  .sheet .hint{font-size:12px;color:var(--grey);margin-bottom:14px;line-height:1.4}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--navy);margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;padding:10px 11px;border-radius:9px;border:1px solid #C9BFA9;background:#fff;color:var(--ink);font-size:16px}
  .field textarea{min-height:90px;resize:vertical;line-height:1.45}
  .field .help{font-size:11px;color:var(--grey);margin-top:4px;line-height:1.35}
  .btn-pri{width:100%;padding:13px;border-radius:11px;background:var(--orange);color:#fff;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .btn-sec{width:100%;padding:11px;border-radius:11px;background:#EFE8D8;color:var(--navy);font-size:13px;font-weight:700;margin-top:8px}
  .btn-del{width:100%;padding:11px;border-radius:11px;background:#fff;color:#C0392B;border:1px solid #E8C9C4;font-size:13px;font-weight:700;margin-top:8px}
  .copy-list-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:9px}
  .copy-list-item .grow{flex:1}
  .mini-act{font-size:11px;font-weight:800;color:var(--orange);padding:4px 8px;border-radius:6px;background:#FBEFE2}
  .edit-pill{font-size:11px;font-weight:800;color:var(--orange);background:#FBEFE2;padding:5px 10px;border-radius:8px;border:1px solid #F2D9C4}
  .seg{display:flex;gap:6px;background:#EFE8D8;padding:4px;border-radius:11px;margin-bottom:14px}
  .seg button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:800;color:var(--grey);text-transform:uppercase;letter-spacing:.3px}
  .seg button.on{background:#fff;color:var(--navy)}
  .empty{text-align:center;padding:34px 16px;color:var(--grey);font-size:13px;line-height:1.5}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--safe-bot));
         background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;
         z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .update-bar{position:fixed;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;background:var(--orange);color:#fff;
              padding:12px 16px calc(12px + var(--safe-bot));display:none;align-items:center;justify-content:space-between;z-index:70;font-size:13px;font-weight:700}
  .update-bar.show{display:flex}
  .update-bar button{background:#fff;color:var(--orange);padding:7px 14px;border-radius:8px;font-weight:800;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" aria-label="Aggiungi">＋</button>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="update-bar" id="updateBar">
  <span>Disponibile una versione aggiornata.</span>
  <button onclick="location.reload()">Ricarica</button>
</div>
<script>
/* ============================================================
   SPADANO PLANNER — PWA
   Dati seed = piano v6. L'utente può modificare/aggiungere dal telefono.

(function(){
"use strict";

// ---------- COSTANTI ----------

};

// ---------- DATI SEED (piano v6) ----------
var SEED = {
  meta:{ title:"Piano v7", subtitle:"15 giugno → 13 luglio · l'arco completo",
         triggers:"<b>GUIDA</b> sempre · <b>LISTA</b> 20–24/6 · <b>IKIGAI</b> dal 25/6 · <b>PERCORSO</b> dal 6/7" },
  retro:[
    {id:"r0",lab:"Campo NOME del profilo",copy:"Alessandro | Ricomposizione Corporea"},
    {id:"r1",lab:"Bio nuova (3 righe)",copy:"Ricomposizione corporea per uomini 28–45\nDa padre fuori forma a natural bodybuilder\nScrivimi GUIDA → guida gratuita per ripartire"},

    {id:"r3",lab:"Primo commento → reel «+25 kg»",copy:"Io: +25 kg senza accorgermene. Tu quanti ne hai messi su\nda quando hai smesso? Scrivi il numero 👇"},
    {id:"r4",lab:"Primo commento → reel «Il giorno in cui ho deciso»",copy:"Il mio momento: mio figlio in braccio, io senza fiato.\nIl tuo c'è già stato? SÌ o NON ANCORA 👇"},
    {id:"r5",lab:"Primo commento → reel «Le 6 del mattino»",copy:"Per me le 6:00, per non togliere tempo a nessuno.\nTu: MATTINA o SERA? 👇"},

  ],

    { n:2, title:"Chiusura Settimana 2 — Tecnica",
      goal:"Si chiude la settimana del ferro. Da sabato parte il trigger a commento: GUIDA.",
      hash:"#spadanocoaching #naturalbb #ricomposizionecorporea #tecnica #over35 #allenamentonatural",
      days:[
        {id:"d12",date:"2026-06-12",lab:"VEN 12",type:"REEL",time:"20:00",pillar:"ferro",
         title:"Mente-muscolo: perché non «senti» il muscolo",
         nota:"Script e caption: planner v5, invariati. Aggiorna solo la domanda finale e fissa il primo commento.",
         q:"SENTO o SPOSTO?",cta:"Salva e provalo",
         copy:[{l:"Domanda finale caption",t:"Lo senti davvero il muscolo o sposti il peso? SENTO o SPOSTO 👇"},
               {l:"Primo commento (fissalo)",t:"Test veloce: l'ultima serie di ieri l'hai SENTITA o l'hai SPOSTATA? 👇"}],

         tasks:["Pubblicato ore 20:00","Domanda caption aggiornata","Primo commento fissato","Prima ora completata","Stories del giorno","DM a chi scrive"]},
        {id:"d13",date:"2026-06-13",lab:"SAB 13",type:"CAROSELLO",time:"11:00",pillar:"salute",
         title:"Tornare in palestra dopo anni di stop senza farti male",
         nota:"Slide 1–7: planner v5 invariate. Slide 8 e caption: NUOVE — CTA «Commenta GUIDA».",
         q:"Da quanti anni non ti alleni? (numero)",cta:"Commenta GUIDA",
         copy:[{l:"Slide 8 — nuovo testo",t:"Vuoi il rientro completo, passo per passo?\nCommenta GUIDA 👇 e ti mando gratis\n«Ritorno in Forma Dopo i 30»."},
               {l:"Caption nuova",t:"Torni in palestra dopo anni? Leggi questo prima di farti male.\n\nL'errore più grande: ripartire da dove avevi lasciato dieci anni fa.\nIl corpo non è quello, e pretenderlo è la via più rapida\nverso l'infortunio e l'ennesimo abbandono.\n\nIl rientro giusto: carichi leggeri all'inizio, tecnica prima di tutto,\nriscaldamento sempre, costanza al posto dell'intensità da eroe.\n\nTutto il rientro è nella mia guida gratuita\n«Ritorno in Forma Dopo i 30»: commenta GUIDA 👇 e te la mando.\n\nDa quanti anni non ti alleni? Scrivi il numero."},

      ]},
    { n:3, title:"Le verità che nessuno dice",

      days:[
        {id:"d15",date:"2026-06-15",lab:"LUN 15",type:"REEL",time:"18:30",pillar:"verita",
         title:"Integratori: te ne servono 3, non 30",
         nota:"Hook e corpo: planner v5 invariati. Nuove: chiusura, finale caption, primo commento.",
         q:"Quanti barattoli? (numero)",cta:"Commenta GUIDA",
         copy:[{l:"Script completo (~45s)",t:"Apri il cassetto degli integratori. Conta i barattoli. Adesso ti dico la verità.\n\nNei tuoi primi mesi te ne servono tre, non trenta. E forse nemmeno tre.\n\nLa proteina in polvere, comoda quando non arrivi col cibo. La creatina, l'unico\nintegratore con vere prove dietro, e costa pochissimo. La vitamina D se stai\npoco al sole. Punto. Tutto il resto — bruciagrassi, pre-workout colorati,\namminoacidi a quaranta euro — è marketing costruito sulle tue insicurezze.\n\nLo so perché ci sono cascato anch'io: al massimo storico avevo lo scaffale pieno,\ne i risultati venivano dal cibo e dall'allenamento, non da quei barattoli.\n\nPrima sistema sonno, proteine e allenamento. Poi, se avanzano soldi,\nla creatina. Non il contrario.\n\nOra apri il cassetto e contali davvero: quanti barattoli hai?\nScrivi il numero nei commenti — niente vergogna, c'ero anch'io."},
               {l:"Caption completa",t:"Apri il cassetto. Conta i barattoli. Poi leggi.\n\nNei primi mesi te ne servono tre, non trenta: proteine se non arrivi col cibo,\ncreatina (l'unica con prove vere, e costa poco), vitamina D se stai poco al sole.\nIl resto è marketing sulle tue insicurezze. Ci sono cascato anch'io.\n\nPrima sonno, proteine e allenamento. Poi, semmai, la creatina. Non il contrario.\n\nI 5 errori di chi riparte sono nella mia guida gratuita:\ncommenta GUIDA 👇 e te la mando in DM.\n\nQuanti barattoli hai nel cassetto? Scrivi il numero."},
               {l:"Primo commento (fissalo)",t:"Io al massimo storico: ___ barattoli. Oggi: pochissimi. Tu? Scrivi il numero 👇"}],

        {id:"d16",date:"2026-06-16",lab:"MAR 16",type:"REEL",time:"12:30",pillar:"verita",
         title:"Perché NON ti vendo i «30 giorni per la tartaruga»",
         nota:"Hook e corpo: planner v5 invariati.",
         q:"Quante challenge provate? (numero)",cta:"Condividi a un amico",
         copy:[{l:"Script completo (~45s)",t:"Non ti venderò mai i «30 giorni per la tartaruga». E ti spiego perché,\nanche se mi costa clienti.\n\nIn trenta giorni puoi gonfiarti per una foto. Tagli l'acqua, ti svuoti, fai luce\ngiusta e scatti. Poi in due settimane torni esattamente come prima, più frustrato.\n\nQuelle challenge funzionano benissimo — sul portafoglio di chi le vende.\nVendono una scorciatoia che non esiste, e quando fallisci dai la colpa a te,\nnon al metodo. Così ricompri.\n\nIo lavoro con chi vuole un cambiamento che dura dieci anni,\nnon una foto che dura dieci giorni. È meno sexy da promettere,\nma è l'unica cosa che ti cambia davvero la vita.\n\nDimmi la verità: quante challenge da 30 giorni hai provato?\nScrivi il numero nei commenti."},
               {l:"Caption completa",t:"Non ti vendo i «30 giorni per la tartaruga». Mai. Anche se mi costa clienti.\n\nIn 30 giorni ti gonfi per una foto e poi torni come prima, più frustrato.\nQuelle challenge funzionano — sul portafoglio di chi le vende.\n\nIo lavoro per un cambiamento che dura dieci anni, non una foto che dura dieci giorni.\nMeno sexy da promettere, ma è l'unica cosa che funziona.\n\nConosci uno che sta per cadere nell'ennesima challenge? Mandagli questo reel.\n\nQuante challenge da 30 giorni hai provato? Scrivi il numero."},
               {l:"Primo commento (fissalo)",t:"Le vedo vendere ogni giorno, e so perché funzionano (sul portafoglio). Tu quante ne hai provate? 👇"}],
         stories:["Clip in palestra: «Niente miracoli, solo lavoro»","Sondaggio: «Ti hanno mai promesso risultati garantiti?» → Sì / No","Reshare reel «30 giorni»"],

        {id:"d17",date:"2026-06-17",lab:"MER 17",type:"REEL",time:"18:30",pillar:"verita",
         title:"«Sono troppo vecchio» è la scusa più comoda",
         nota:"Hook e corpo: planner v5 invariati. Prevedi tempo: hai promesso di rispondere a tutti.",
         q:"La tua età (numero)",cta:"Commenta GUIDA",
         copy:[{l:"Script completo (~50s)",t:"«Sono troppo vecchio per ricominciare.» La sento di continuo.\nÈ la scusa più comoda che esista, e adesso te la smonto.\n\nDopo i trenta, dopo i quaranta, il corpo non smette di rispondere.\nRisponde più lentamente, è vero: recuperi un po' meno, devi curare di più\nsonno e tecnica. Ma il muscolo cresce, la forza torna, il grasso cala. A ogni età.\n\nQuello che cambia non è il corpo: è la testa. «Troppo vecchio» è quello che ti dici\nper non affrontare la fatica di iniziare. Lo so perché me lo sono detto anch'io,\nfermo da un anno e mezzo, con venticinque chili in più.\n\nL'età non è il muro. È la scusa dietro cui ti nascondi per non iniziare.\nToglila di mezzo. E per dimostrartelo: scrivi la tua età nei commenti —\nti rispondo io, uno per uno."},
               {l:"Caption completa",t:"«Sono troppo vecchio.» La scusa più comoda che esista. Te la smonto.\n\nDopo i 30, dopo i 40, il corpo risponde ancora: più lento, sì, ma il muscolo cresce\ne il grasso cala a ogni età. Quello che cambia è la testa, non il fisico.\nMe lo sono detto anch'io, fermo da un anno e mezzo con +25 kg.\n\nL'età non è il muro. È la scusa dietro cui ti nascondi per non iniziare.\n\nVuoi ripartire alla tua età senza farti male?\nCommenta GUIDA 👇 e ti mando «Ritorno in Forma Dopo i 30».\n\nQuanti anni hai? Scrivilo qui sotto. Rispondo a tutti."},
               {l:"Primo commento (fissalo)",t:"Io sono ripartito da +25 kg. Si riparte, te lo garantisco. La tua età? 👇"}],
         stories:["Storia a camera: «L'età è una scusa, ve lo dimostro»","Sondaggio: «Pensi di essere troppo vecchio per cambiare?» → Sì / No","Reshare reel età"],
         tasks:["Girato","Pubblicato in orario","Primo commento fissato","Prima ora completata","Stories del giorno","DM a chi vota / commenta"]},
        {id:"d18",date:"2026-06-18",lab:"GIO 18",type:"REEL",time:"20:00",pillar:"salute",drop:true,
         title:"Stai seduto 8 ore? La palestra non basta",
         nota:"Hook e corpo: planner v5 invariati. ➜ Questo è il reel da saltare se la settimana è pesante.",
         q:"Ore seduto (numero)",cta:"Mandalo a un collega",
         copy:[{l:"Script completo (~50s)",t:"Ti alleni un'ora e stai seduto altre nove. E poi ti chiedi perché\nla schiena fa male e la pancia non se ne va. Te lo spiego.\n\nUn'ora di palestra non cancella nove ore da fermo. Il corpo si adatta a quello\nche fai di più, e se per la maggior parte del giorno sei piegato su una sedia,\nquella diventa la tua forma: anche corte, schiena rigida, glutei spenti.\n\nNon ti sto dicendo di vivere in palestra. Ti sto dicendo di spezzare lo stare fermo.\nAlzati ogni ora, anche solo due minuti. Una camminata vera ogni giorno.\nLe scale invece dell'ascensore. Piccole cose che, sommate, contano più\ndi un'altra serie di addominali.\n\nDa bodybuilder lo so: il movimento fuori dalla palestra è metà del lavoro.\n\nSii onesto: quante ore stai seduto al giorno? Scrivi il numero."},
               {l:"Caption completa",t:"Ti alleni un'ora e stai seduto nove. Poi ti chiedi perché la schiena fa male.\n\nUn'ora di palestra non cancella nove ore da fermo: il corpo prende la forma\ndi ciò che fai di più. Anche corte, schiena rigida, glutei spenti.\n\nNon devi vivere in palestra. Devi spezzare lo stare fermo: alzati ogni ora,\ncammina ogni giorno, fai le scale. Sommate, contano più di un'altra serie.\n\nMandalo a un collega incollato alla sedia da stamattina.\n\nQuante ore seduto al giorno? Scrivi il numero, sii onesto."},
               {l:"Primo commento (fissalo)",t:"Le mie, tra due lavori: ___ ore. Per questo le contromisure sopra non sono opzionali. Tu? 👇"}],
         stories:["Clip: ti alzi / cammini durante una pausa lavoro","Sondaggio: «Mal di schiena negli ultimi 6 mesi?» → Sì / No","Reshare reel postura"],
         tasks:["Girato","Pubblicato in orario","Primo commento fissato","Prima ora completata","Stories del giorno","DM a chi vota / commenta"]},
        {id:"d19",date:"2026-06-19",lab:"VEN 19",type:"REEL",time:"20:00",pillar:"verita",
         title:"La genetica è la scusa più comoda di tutte",
         nota:"Hook e corpo: planner v5 invariati.",
         q:"SÌ o NO (l'hai usata?)",cta:"Tagga l'amico della «genetica»",
         copy:[{l:"Script completo (~45s)",t:"«Lui ha la genetica.» La scusa più comoda di tutte. E quasi sempre è falsa.\n\nLa genetica conta davvero quando sei avanzato, dopo anni di allenamento serio,\nquando lotti per l'ultimo cinque percento. A quel punto sì, fa la differenza\ntra bravo e fenomeno.\n\nMa tu che riparti da fermo? La genetica non c'entra niente col tuo punto.\nQuello che ti separa dai risultati non sono i geni: è la costanza che non hai avuto,\nla tecnica che nessuno ti ha insegnato, il programma sbagliato che hai seguito.\n\nÈ comodo dire «lui è fortunato»: ti toglie la responsabilità.\nMa la verità è che il novanta percento del tuo risultato dipende da cose\nche puoi controllare, non dal DNA.\n\nSii onesto con me: l'hai mai usata anche tu, questa scusa? SÌ o NO nei commenti."},
               {l:"Caption completa",t:"«Lui ha la genetica.» La scusa più comoda di tutte. E quasi sempre falsa.\n\nLa genetica conta quando sei avanzato da anni e lotti per l'ultimo 5%.\nMa se riparti da fermo non c'entra niente: ti separano la costanza,\nla tecnica, il programma giusto. Cose che controlli tu, non il DNA.\n\nDire «lui è fortunato» è comodo: ti toglie la responsabilità.\n\nTaggalo: tutti abbiamo l'amico che dice «eh ma lui ha la genetica».\n\nE tu, l'hai mai usata questa scusa? SÌ o NO 👇"},
               {l:"Primo commento (fissalo)",t:"Io SÌ, l'ho usata anch'io. Era più comoda che guardare la mia costanza. Tu? 👇"}],
         stories:["Storia a camera sulla scusa-genetica, tono diretto","Sondaggio: «Conosci uno che dice «lui ha la genetica»?» → Sì / Più di uno","Reshare reel genetica"],
         tasks:["Girato","Pubblicato in orario","Primo commento fissato","Prima ora completata","Stories del giorno","DM a chi vota / commenta"]},
        {id:"d20",date:"2026-06-20",lab:"SAB 20",type:"CAROSELLO",time:"11:00",pillar:"salute",
         title:"5 errori che ti distruggono le articolazioni dopo i 35",

               {l:"Caption completa",t:"5 errori che ti distruggono le articolazioni dopo i 35. Salvali prima di allenarti.\n\nNon è il peso a romperti: è come lo sollevi. Ego lifting, zero riscaldamento,\nstessi movimenti sempre, range parziali, dolore ignorato. Cinque errori\nche pago io stesso ogni volta che vedo qualcuno ripartire di fretta.\n\nSi spinge forte — ma si protegge l'atleta. Sempre le due cose insieme.\n\nUna cosa, prima che chiudi: giovedì apro i primi posti.\nChi è in lista lo sa prima che lo pubblichi.\nCommenta LISTA 👇 e ti scrivo io.\n\nQuale dei 5 errori fai (o facevi) anche tu? Scrivi il numero 1–5."},
               {l:"Primo commento (fissalo)",t:"Quello che vedo fare più spesso (e che fa più danni): il n.2, ego lifting. Tu? 1–5 👇"}],
         stories:["Reshare carosello: «Salvatelo»","Storia a camera: «Giovedì apro i primi posti. Rispondi LISTA a questa storia.»"],

      days:[
        {id:"d22",date:"2026-06-22",lab:"LUN 22",type:"REEL",time:"18:30",pillar:"identita",
         title:"A tuo figlio non serve un padre stanco. Serve te.",
         q:"SPECCHIO o QUALCUNO",cta:"Commenta LISTA",
         copy:[{l:"Script completo (~45s)",t:"Non mi alleno per gli addominali. Mi alleno perché mio figlio\nmerita un padre con energia, non uno spento sul divano.\n\nVi ho raccontato come mi ero perso. La cosa che mi fa più male\ndi quel periodo non è il fisico. È che tornavo a casa svuotato\ne a mio figlio davo gli avanzi.\n\nRimettermi in forma non è stato egoismo. È stato il regalo\npiù grande che potevo fargli: un padre che c'è davvero.\n\nSe ti alleni solo per lo specchio, prima o poi molli.\nSe ti alleni per esserci per chi ami, non molli più.\n\nDimmi la verità: tu per chi ti alleni?\nScrivi SPECCHIO o QUALCUNO nei commenti."},
               {l:"Caption completa",t:"Non mi alleno per gli addominali.\n\nLa parte che fa ancora male non è l'aspetto: è che a mio figlio\ndavo gli avanzi della giornata. Presente col corpo, assente con l'energia.\n\nUn corpo allenato non è un trofeo da specchio: è il motore\ncon cui reggi il lavoro, le notti, la famiglia.\n\nGiovedì apro i primi posti. Vuoi saperlo prima? Commenta LISTA 👇\n\nE tu per chi ti alleni: SPECCHIO o QUALCUNO?"},
               {l:"Primo commento (fissalo)",t:"Io: QUALCUNO. Dorme ancora quando esco alle 6 — ed è esattamente il motivo per cui esco. Tu? 👇"}],

         tasks:["Girato","Pubblicato in orario","Primo commento fissato","Prima ora completata","Stories del giorno","DM a chi vota / commenta"]},
        {id:"d23",date:"2026-06-23",lab:"MAR 23",type:"REEL",time:"12:30",pillar:"storia",
         title:"Non sono il coach con 50k follower. E va bene così.",
         q:"FAMOSO o PRESENTE",cta:"Commenta LISTA",
         copy:[{l:"Script completo (~45s)",t:"Non ho cinquantamila follower. Non ho testimonial ovunque.\nNon ho il fisico da copertina. E ti spiego perché per te\npuò essere un vantaggio.\n\nQuei coach hanno duecento clienti, e ti rispondono —\nquando rispondono — con un messaggio copia-incolla.\nIo ne seguo pochi, di proposito. E li seguo davvero.\n\nE c'è una cosa che il coach famoso spesso non ha più:\nio ci sono passato da poco. Mi ricordo com'è\nguardarsi allo specchio e non riconoscersi.\n\nTu cosa sceglieresti: il coach FAMOSO o quello PRESENTE?"},
               {l:"Caption completa",t:"«Ci sono coach più grossi di te.» Vero. Te lo dico io per primo.\n\nMa centinaia di clienti = risposte copia-incolla, e una distanza\nenorme da com'è davvero essere fuori forma a 35 anni.\n\nIo seguo poche persone, di proposito. E ci sono passato da poco.\n\nGiovedì apro i primi posti. Chi è in lista lo sa prima: commenta LISTA 👇\n\nTu cosa cerchi: FAMOSO o PRESENTE?"},
               {l:"Primo commento (fissalo)",t:"Quando ero perso mi sarebbe servito quello PRESENTE. Per questo seguo pochi. Tu? 👇"}],
         stories:["Clip in palestra, energia alta","Sondaggio: «Un coach con 200 clienti può seguirti davvero?» → Sì / No","Reshare reel 50k + «Rispondi LISTA»"],
         tasks:["Girato","Pubblicato in orario","Primo commento fissato","Prima ora completata","Stories del giorno","DM a chi vota / commenta"]},
        {id:"d24",date:"2026-06-24",lab:"MER 24",type:"REEL",time:"18:30",pillar:"verita",
         title:"«No pain no gain» è la bugia che ti fa infortunare",
         q:"SÌ o NO (infortunio evitabile)",cta:"Commenta LISTA — ultima chiamata",
         copy:[{l:"Script completo (~45s)",t:"«Se non fa male non funziona.» Questa frase ha rovinato\npiù schiene e spalle di qualsiasi scheda sbagliata.\n\nIl bruciore muscolare della fatica è una cosa: fa parte del gioco.\nIl dolore articolare — acuto, localizzato, sbagliato —\nè un segnale di stop. Non una medaglia.\n\nAllenarsi duro: sì, sempre. Allenarsi nel dolore sbagliato: mai.\nImparare la differenza è ciò che ti fa durare.\n\nTi sei mai fermato per un infortunio che potevi evitare?\nSÌ o NO nei commenti."},
               {l:"Caption completa",t:"«Se non fa male non funziona» ha rovinato più spalle\ndi qualsiasi programma sbagliato.\n\nBruciore muscolare: normale. Dolore articolare acuto: stop.\nConfonderli costa sei settimane di fermo. Distinguerli ti fa durare anni.\n\nDomani apro i primi posti. Ultima chiamata per l'anteprima: commenta LISTA 👇\n\nTi sei mai fermato per un infortunio evitabile? SÌ o NO."},
               {l:"Primo commento (fissalo)",t:"Quasi tutti quelli che ripartono ne hanno almeno uno alle spalle. Tu? SÌ o NO 👇"}],
         stories:["COUNTDOWN sticker → giovedì ore 20:00","«Domani apro 5 posti. Lista chiusa stanotte: rispondi LISTA.»","Reshare reel no pain"],
         tasks:["Girato","Pubblicato in orario","Primo commento fissato","Countdown sticker attivo","Prima ora completata","Stories del giorno","DM a chi vota / commenta"]},
        {id:"d25",date:"2026-06-25",lab:"GIO 25",type:"REEL",time:"20:00",pillar:"lancio",
         title:"APERTURA · Apro 5 posti. Te lo dico in modo onesto.",
         nota:"Il giorno più importante del mese. Mattina: DM a tutta la LISTA. Sera ore 20: reel. Da oggi il trigger è IKIGAI.",
         q:"Da quanti anni rimandi? (numero)",cta:"IKIGAI in DM (o nei commenti)",
         copy:[{l:"DM alla LISTA (mattina)",t:"Buongiorno [nome] 👊 Come promesso, lo sai prima degli altri:\noggi apro i 5 posti del percorso, prezzo di lancio.\nStasera lo pubblico — ma tu puoi partire adesso.\nSe vuoi il tuo: rispondimi IKIGAI e ti faccio 3 domande veloci."},
               {l:"Script completo (~50s)",t:"Sono trasparente con te: sto costruendo questo\nper farlo diventare il mio unico lavoro. E mi servono\npoche persone serie che ci credano adesso.\n\nPer quasi un mese vi ho dato tutto senza chiedere niente.\n\nOggi apro 5 posti, a un prezzo di lancio che non riproporrò più.\nFaccio due lavori e ho un figlio piccolo: posso seguire bene\nsolo poche persone. Per questo sono pochi.\n\nChi entra ora scommette su di me prima dei numeri grossi.\n\nSe sei l'uomo che si è perso ed è pronto a tornare:\nscrivimi IKIGAI in DM, o commentalo qui e ti scrivo io.\n\nE dimmi: da quanti anni rimandi? Scrivi il numero."},
               {l:"Caption completa",t:"Oggi apro. E ve lo dico come l'ho sempre detto: chiaro.\n\nSto costruendo Spadano Coaching per farlo diventare il mio\nunico lavoro. Due lavori, un figlio piccolo, un sogno.\n\nApro 5 posti al prezzo di Lancio: il più basso che farò mai.\nPosso seguire davvero bene solo poche persone.\n\nScrivimi IKIGAI in DM (o commentalo: ti scrivo io).\nNe parliamo, senza impegno.\n\nDa quanti anni rimandi? Scrivi il numero 👇"},
               {l:"Primo commento (fissalo)",t:"Io ho rimandato ___ anni prima di decidere. So com'è. Tu? Scrivi il numero 👇"}],

         tasks:["Mattina: DM a tutta la LISTA","Girato","Pubblicato ore 20:00","Primo commento fissato","Prima ora completata","Stories del giorno","DM IKIGAI: 3 domande → call"]},
        {id:"d26",date:"2026-06-26",lab:"VEN 26",type:"REEL",time:"20:00",pillar:"salute",
         title:"Non voglio farti tornare come a 20 anni. Voglio di meglio.",
         q:"MERITO o CASO",cta:"IKIGAI in DM",
         copy:[{l:"Script completo (~45s)",t:"La gente vuole «tornare come a vent'anni». Io non te lo prometto.\nTi prometto qualcosa di più serio.\n\nA vent'anni eri in forma per caso: metabolismo veloce,\nzero responsabilità. Era un regalo dell'età, non un merito.\n\nQuello che puoi costruire adesso vale di più:\nun fisico fatto con consapevolezza, una forza che non ti rompe,\nl'energia per reggere lavoro e famiglia.\n\nNon la versione nostalgica di te. La versione migliore di te.\n\nA vent'anni eri in forma per MERITO o per CASO?"},
               {l:"Caption completa",t:"«Voglio tornare come a 20 anni.» Non te lo prometto. Posso di meglio.\n\nA 20 anni eri in forma per caso. Adesso puoi esserlo per scelta:\nforza che non ti rompe, salute che ti porti integro per decenni.\n\nRestano pochi posti del prezzo di Lancio.\nScrivimi IKIGAI in DM e ne parliamo senza impegno.\n\nA 20 anni: MERITO o CASO? Sii onesto 👇"},

               {l:"Caption completa",t:"Posti aperti: prezzi, regole, per chi è (e per chi non è). Tutto chiaro, swipe.\n\nNessun prezzo nascosto, nessuna pressione. Ti spiego come lavoro, quanto costa,\ne soprattutto per chi NON è adatto questo percorso — perché non prendo tutti.\n\nDomanda secca, anche solo per curiosità:\n3, 6 o 12 mesi — quale sceglieresti? Scrivi il numero 👇"},

      {id:"d30",date:"2026-07-01",lab:"MER 1/7",type:"REEL",time:"18:30",pillar:"ferro",

        {l:"Script (~45s)",t:"Due persone, stessa età, stesso obiettivo. E gli do due schede diverse.\nNon per complicare. Perché è l'unico modo che funziona.\n\nUno ha la spalla che scricchiola da un vecchio infortunio:\nniente military press pesante, lavoriamo su angoli che non gli fanno male.\nL'altro sta seduto nove ore al giorno: prima sistemiamo le anche\ne la schiena, o lo squat diventa un problema.\n\nDa bodybuilder lo so bene: i princìpi sono universali —\nrange completo, eccentrica controllata, sovraccarico progressivo.\nMa gli esercizi si scelgono sulla persona, non sul manuale.\n\nChi ti vende la stessa scheda per tutti non sta allenando te.\nSta fotocopiando.\n\nHai mai copiato la scheda di un altro? SÌ o NO."},

       tasks:["Girato","Pubblicato ore 18:30","Primo commento fissato","Prima ora completata","Stories del giorno","DM a chi commenta GUIDA"]},
      {id:"d31",date:"2026-07-03",lab:"VEN 3/7",type:"REEL",time:"20:00",pillar:"verita",

        {l:"Script (~50s)",t:"La cosa più difficile dei primi dieci giorni non è l'allenamento.\nÈ un'altra, e quasi nessuno la dice.\n\nI primi giorni il fisico non cambia. È normale, è fisiologia.\nMa la testa vuole la prova subito, vuole vedere lo specchio diverso domani.\n\nE lì si gioca tutto. Perché chi molla, molla adesso —\nnon perché l'allenamento sia troppo duro, ma perché non vede ancora niente.\n\nIl mio lavoro nei primi dieci giorni è quasi più di testa che di ferro:\nti tolgo l'aspettativa sbagliata e ti do quella giusta.\nLa prima vittoria non è lo specchio. È esserci stato tre volte questa settimana.\nPoi il corpo arriva. Arriva sempre, se non molli prima.\n\nCosa ti ferma di più — il tempo o la testa? Scrivilo nei commenti."},
        {l:"Caption",t:"La parte più difficile dei primi 10 giorni non è allenarsi.\n\nÈ che il fisico ancora non cambia, ma la testa vuole la prova subito.\nChi molla, molla qui — non per fatica, ma perché non vede niente.\n\nIl mio lavoro all'inizio è togliere l'aspettativa sbagliata:\nla prima vittoria non è lo specchio, è esserci stato tre volte.\nPoi il corpo arriva. Sempre, se non molli prima.\n\nVuoi ripartire con la testa giusta? Commenta GUIDA 👇\n\nCosa ti ferma di più: il TEMPO o la TESTA?"},

       title:"L'errore di assetto sullo squat che vedo in tutti",

        {l:"Script (~45s)",t:"C'è un errore sullo squat che vedo praticamente in tutti quelli\nche ripartono. E quando lo correggo, cambia tutto in una seduta.\n\nScendi e il ginocchio va avanti, il busto crolla in avanti,\ne la mattina dopo ti fa male la schiena, non le gambe.\nIl problema non è lo squat: è l'assetto.\n\nTieni il petto alto, spingi il bacino indietro come per sederti,\npeso sul mezzo piede, e scendi controllando — eccentrica lenta,\nnon ti lasci cadere. Il muscolo lavora dove deve, la schiena ringrazia.\n\nDa bodybuilder: lo squat è un esercizio fantastico, ma fatto male\nè il primo modo per fermarti. Si spinge forte, ma con l'assetto giusto.\n\nLo squat lo senti sulle gambe o sulla schiena? Scrivi GAMBE o SCHIENA."},

function copyText(txt,btn){
  function ok(){ if(btn){ btn.classList.add("ok"); btn.textContent="Copiato"; setTimeout(function(){ btn.classList.remove("ok"); btn.textContent="Copia"; },1500);} }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,function(){ fallback(); });
  } else { fallback(); }
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ toast("Copia non riuscita"); }
    document.body.removeChild(ta);
  }
}

// ============================================================
var sheet=document.getElementById("sheet"), sheetBg=document.getElementById("sheetBg");
function openSheetHTML(html){ sheet.innerHTML='<div class="sheet-grip"></div>'+html; sheetBg.classList.add("show"); sheet.classList.add("show"); }
function closeSheet(){ sheet.classList.remove("show"); sheetBg.classList.remove("show"); }
window.__sp.closeSheet=closeSheet;
sheetBg.onclick=closeSheet;

function findDay(id){
  var ws=st().content.weeks;
  for(var i=0;i<ws.length;i++) for(var j=0;j<ws[i].days.length;j++) if(ws[i].days[j].id===id) return {d:ws[i].days[j],w:ws[i],wi:i,di:j};
  return null;
}

function copyEditorRows(copyArr){
  var h='<div id="copyRows">';
  copyArr.forEach(function(c,i){ h+=copyRowHTML(c.l,c.t,i); });
  h+='</div>';
  h+='<button class="mini-act" style="margin-top:2px" data-act="addCopyRow">＋ Aggiungi un blocco di testo</button>';
  return h;
}
function copyRowHTML(l,t,i){
  return '<div class="copy-list-item" data-row="'+i+'"><div class="grow">'+
    '<input class="cr-l" placeholder="Etichetta (es. Caption)" value="'+esc(l)+'" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #C9BFA9;font-size:15px;margin-bottom:6px">'+
    '<textarea class="cr-t" placeholder="Testo da copiare" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #C9BFA9;font-size:15px;min-height:70px;line-height:1.4">'+esc(t)+'</textarea>'+
    '</div><button class="mini-act" style="background:#fff;color:#C0392B" data-act="removeCopyRow">✕</button></div>';
}
window.__sp.addCopyRow=function(){
  var box=document.getElementById("copyRows");
  var i=box.children.length;
  box.appendChild(window.__util.el(copyRowHTML("","",i)));
};

function readCopyRows(){
  var rows=document.querySelectorAll("#copyRows .copy-list-item"), out=[];
  rows.forEach(function(r){
    var l=r.querySelector(".cr-l").value.trim();
    var t=r.querySelector(".cr-t").value;
    if(l||t.trim()) out.push({l:l||"Testo",t:t});
  });
  return out;
}

function pillarOptions(sel){
  return PILLAR_KEYS.map(function(k){ return '<option value="'+k+'"'+(k===sel?" selected":"")+'>'+PILLARS[k].n+'</option>'; }).join("");
}

function dayFormHTML(d,isNew,weekN){
  var h='<h2>'+(isNew?"Nuovo contenuto":"Modifica contenuto")+'</h2>';
  h+='<div class="hint">Tutto quello che scrivi qui finisce nel Piano e, se è la data di oggi, nella tab Oggi.</div>';
  h+='<div class="field"><label>Etichetta giorno</label><input id="f-lab" placeholder="es. LUN 29" value="'+esc(d.lab||"")+'"></div>';
  h+='<div class="row2"><div class="field" style="flex:1"><label>Data</label><input id="f-date" type="date" value="'+esc(d.date||"")+'"></div>';
  h+='<div class="field" style="flex:1"><label>Ora</label><input id="f-time" placeholder="18:30" value="'+esc(d.time||"")+'"></div></div>';
  h+='<div class="row2"><div class="field" style="flex:1"><label>Tipo</label><select id="f-type">';
  ["REEL","CAROSELLO","STORIES","POST"].forEach(function(x){ h+='<option'+(d.type===x?" selected":"")+'>'+x+'</option>'; });
  h+='</select></div><div class="field" style="flex:1"><label>Pilastro</label><select id="f-pillar">'+pillarOptions(d.pillar||"storia")+'</select></div></div>';
  h+='<div class="field"><label>Titolo / tema</label><input id="f-title" placeholder="Tema del contenuto" value="'+esc(d.title||"")+'"></div>';
  h+='<div class="row2"><div class="field" style="flex:1"><label>CTA</label><input id="f-cta" placeholder="es. Commenta GUIDA" value="'+esc(d.cta||"")+'"></div>';
  h+='<div class="field" style="flex:1"><label>Domanda (binaria/num.)</label><input id="f-q" placeholder="es. SÌ o NO" value="'+esc(d.q||"")+'"></div></div>';
  h+='<div class="field"><label>Nota</label><textarea id="f-nota" placeholder="Promemoria operativo (facoltativo)">'+esc(d.nota||"")+'</textarea></div>';
  h+='<div class="field"><label>Blocchi di testo da copiare (script, caption, primo commento…)</label>'+copyEditorRows(d.copy||[])+'</div>';
  h+='<div class="field"><label>Stories del giorno — una per riga</label><textarea id="f-stories" placeholder="Una storia per riga" style="min-height:90px">'+esc((d.stories||[]).join("\n"))+'</textarea></div>';
  h+='<div class="field"><label>Checklist — una voce per riga</label><textarea id="f-tasks" placeholder="Una voce per riga" style="min-height:90px">'+esc((d.tasks||[]).join("\n"))+'</textarea><div class="help">Se la lasci vuota, uso una checklist standard.</div></div>';
  h+='<button class="btn-pri" data-act="saveDay" data-arg="'+(d.id||"")+'" data-new="'+(isNew?"1":"0")+'" data-week="'+(weekN===null?"":weekN)+'">Salva</button>';
  if(!isNew) h+='<button class="btn-del" data-act="deleteDay" data-arg="'+d.id+'">Elimina questo contenuto</button>';
  h+='<button class="btn-sec" data-act="closeSheet">Annulla</button>';
  return h;
}

function openEditDay(id){
  var f=findDay(id); if(!f) return;
  openSheetHTML(dayFormHTML(f.d,false,f.w.n));
}
function openNewDay(weekN){
  openSheetHTML(dayFormHTML({},true,weekN));
}
window.__sp.editDay=openEditDay;
window.__sp.newDay=openNewDay;

window.__sp.saveDay=function(id,isNew,weekN){
  function val(x){ var e=document.getElementById(x); return e?e.value:""; }
  var lines=function(x){ return val(x).split("\n").map(function(s){return s.trim();}).filter(Boolean); };
  var obj={
    lab:val("f-lab")||"NUOVO", date:val("f-date"), time:val("f-time"),
    type:val("f-type"), pillar:val("f-pillar"), title:val("f-title")||"(senza titolo)",
    cta:val("f-cta"), q:val("f-q"), nota:val("f-nota"),
    copy:readCopyRows(),
    stories:lines("f-stories"),
    tasks:lines("f-tasks")
  };
  if(!obj.tasks.length) obj.tasks=["Girato","Pubblicato in orario","Primo commento fissato","Prima ora completata","Stories del giorno","DM a chi vota / commenta"];
  var ws=st().content.weeks;
  if(isNew){
    obj.id="d"+Date.now();
    var tw=null;
    if(weekN!==null){ for(var i=0;i<ws.length;i++) if(ws[i].n===weekN) tw=ws[i]; }
    if(!tw){ tw=ws[ws.length-1]; }
    tw.days.push(obj);
    // riordina per data
    tw.days.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    toast("Contenuto aggiunto");
  } else {
    var f=findDay(id); if(f){ obj.id=id; ws[f.wi].days[f.di]=obj; }
    f && ws[f.wi].days.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    toast("Contenuto aggiornato");
  }
  save(); closeSheet(); render();
};

window.__sp.deleteDay=function(id){
  var f=findDay(id); if(!f) return;
  if(!window.confirm("Eliminare «"+f.d.title+"»? L'azione non si annulla.")) return;
  st().content.weeks[f.wi].days.splice(f.di,1);
  save(); closeSheet(); render(); toast("Contenuto eliminato");
};

// ---------- NUOVA SETTIMANA ----------
window.__sp.newDay=function(weekN){
  if(weekN===null){ openNewWeek(); return; }
  openNewDay(weekN);
};
function openNewWeek(){
  var h='<h2>Nuova settimana</h2><div class="hint">Crea il contenitore di una nuova settimana o di un mese nuovo. Poi ci aggiungi i contenuti.</div>';
  var maxN=0; st().content.weeks.forEach(function(w){ if(w.n>maxN)maxN=w.n; });
  h+='<div class="field"><label>Numero settimana</label><input id="w-n" type="number" value="'+(maxN+1)+'"></div>';
  h+='<div class="field"><label>Titolo</label><input id="w-title" placeholder="es. Costruzione community"></div>';
  h+='<div class="field"><label>Obiettivo della settimana</label><textarea id="w-goal" placeholder="A cosa serve questa settimana"></textarea></div>';
  h+='<div class="field"><label>Hashtag della settimana</label><textarea id="w-hash" placeholder="#spadanocoaching #naturalbb ..."></textarea></div>';
  h+='<button class="btn-pri" data-act="saveWeek">Crea settimana</button>';
  h+='<button class="btn-sec" data-act="closeSheet">Annulla</button>';
  openSheetHTML(h);
}
window.__sp.saveWeek=function(){
  function val(x){var e=document.getElementById(x);return e?e.value:"";}
  var n=parseInt(val("w-n"),10)||(st().content.weeks.length+1);
  st().content.weeks.push({n:n,title:val("w-title")||"Nuova settimana",goal:val("w-goal")||"",hash:val("w-hash")||"",days:[]});
  st().content.weeks.sort(function(a,b){return a.n-b.n;});
  save(); closeSheet(); render(); toast("Settimana creata");
};

// ---------- MENU IMPOSTAZIONI ----------
function openMenu(){
  var c=st().content;
  var h='<h2>Impostazioni</h2><div class="hint">Intestazione del piano, esporta/importa i contenuti, ricomincia da capo.</div>';
  h+='<div class="field"><label>Titolo del piano</label><input id="m-title" value="'+esc(c.meta.title)+'"></div>';
  h+='<div class="field"><label>Sottotitolo (periodo)</label><input id="m-sub" value="'+esc(c.meta.subtitle)+'"></div>';
  h+='<div class="field"><label>Riga «Mappa trigger»</label><textarea id="m-trig" style="min-height:70px">'+esc(c.meta.triggers.replace(/<\/?b>/g,"*"))+'</textarea><div class="help">Usa *asterischi* per il grassetto.</div></div>';
  h+='<button class="btn-pri" data-act="saveMeta">Salva intestazione</button>';
  h+='<button class="btn-sec" data-act="exportData">⬇︎ Esporta tutti i contenuti (backup)</button>';
  h+='<button class="btn-sec" data-act="pickImport">⬆︎ Importa da backup</button>';
  h+='<input type="file" id="importFile" accept="application/json" style="display:none" data-chg="import">';
  h+='<button class="btn-del" data-act="factoryReset">Ripristina il piano originale (v6)</button>';
  h+='<button class="btn-sec" data-act="closeSheet">Chiudi</button>';
  openSheetHTML(h);
}
window.__sp.openMenu=openMenu;
window.__sp.saveMeta=function(){
  function val(x){var e=document.getElementById(x);return e?e.value:"";}
  var c=st().content;
  c.meta.title=val("m-title")||c.meta.title;
  c.meta.subtitle=val("m-sub");
  c.meta.triggers=esc(val("m-trig")).replace(/\*(.+?)\*/g,"<b>$1</b>");
  save(); closeSheet(); render(); toast("Intestazione salvata");
};
window.__sp.exportData=function(){
  var blob=new Blob([JSON.stringify(st(),null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url;
  a.download="spadano-planner-backup-"+U.todayStr()+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url); toast("Backup esportato");
};
window.__sp.importData=function(input){
  var file=input.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(){ try{ var data=JSON.parse(r.result);
      if(data.content){ window.__setState(data); save(); closeSheet(); render(); toast("Backup importato"); }
      else toast("File non valido"); }catch(e){ toast("File non leggibile"); } };
  r.readAsText(file);
};
window.__sp.factoryReset=function(){
  if(!window.confirm("Ripristinare il piano originale v6? Perdi le modifiche ai contenuti (le spunte restano).")) return;
  st().content=deepClone(window.__SEED); save(); closeSheet(); render(); toast("Piano originale ripristinato");
};
window.__setState=function(s){ window.__replaceState(s); };

// ---------- DELEGA EVENTI (sostituisce gli onclick inline) ----------
// Un solo listener per tutti i click: legge data-act e data-arg dall'elemento.
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act");
  var arg = t.getAttribute("data-arg");
  var sp = window.__sp;
  switch(act){
    case "toggle": sp.toggle(arg); break;
    case "toggleDay": sp.toggleDay(arg); break;
    case "toggleRetro": sp.toggleRetro(); break;
    case "copy": sp.copy(t); break;
    case "tab": sp.tab(arg); break;
    case "editDay": sp.editDay(arg); break;
    case "deleteDay": sp.deleteDay(arg); break;
    case "newDay": sp.newDay(parseInt(arg,10)); break;
    case "newWeek": sp.newDay(null); break;
    case "openMenu": sp.openMenu(); break;
    case "reset": sp.reset(); break;
    case "addCopyRow": sp.addCopyRow(); break;
    case "removeCopyRow": var row=t.closest(".copy-list-item"); if(row) row.remove(); break;
    case "closeSheet": sp.closeSheet(); break;
    case "exportData": sp.exportData(); break;
    case "factoryReset": sp.factoryReset(); break;
    case "saveMeta": sp.saveMeta(); break;
    case "saveWeek": sp.saveWeek(); break;
    case "pickImport": var fi=document.getElementById("importFile"); if(fi) fi.click(); break;
    case "saveDay":
      sp.saveDay(arg||"", t.getAttribute("data-new")==="1", t.getAttribute("data-week")===""?null:parseInt(t.getAttribute("data-week"),10));
      break;
  }
});
// input (ratio, metriche) via delega
document.addEventListener("input", function(e){
  var t=e.target;
  var inp=t.getAttribute && t.getAttribute("data-inp");
  if(!inp) return;
  if(inp==="ratio"){ window.__sp.setRatio(t.getAttribute("data-arg"), t.value); }
  else if(inp==="metric"){ window.__sp.setMetric(t.getAttribute("data-arg"), t.getAttribute("data-arg2"), t.value); }
});
// change (import file) via delega
document.addEventListener("change", function(e){
  if(e.target.getAttribute && e.target.getAttribute("data-chg")==="import"){ window.__sp.importData(e.target); }
});

// ---------- BOOT ----------
document.getElementById("fab").onclick=function(){
  if(window.__tab==="piano"){ openNewDay(st().content.weeks[st().content.weeks.length-1].n); }
  else { window.__tab="piano"; render(); window.scrollTo(0,0); setTimeout(function(){ openNewDay(st().content.weeks[st().content.weeks.length-1].n); },50); }
};

render();

// ---------- SERVICE WORKER ----------
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;
        nw && nw.addEventListener("statechange",function(){
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            document.getElementById("updateBar").classList.add("show");
          }
        });
      });
    }).catch(function(){});
  });
}

})();

</script>
